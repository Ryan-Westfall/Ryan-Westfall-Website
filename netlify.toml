[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/leetcode*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=300"

[[headers]]
  for = "*.pdf"
  [headers.values]
    Content-Disposition = "attachment"

[[redirects]]
  from = "/editor"
  to = "https://github.com/Ryan-Westfall/pixorize-editor"
  status = 301
  force = true

[[redirects]]
  from = "/api/leetcode"
  to = "/.netlify/functions/leetcode"
  status = 200
  force = true

[[redirects]]
  from = "/api/leetcode/*"
  to = "/.netlify/functions/leetcode?username=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/projects"
  to = "/"
  status = 301
  force = true
